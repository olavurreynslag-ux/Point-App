<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Idræts App</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<!-- FORSIDE -->
<div id="menu" class="screen">

  <div class="menuHeader">
    <h1>Idræts App</h1>
    <p>Vælg aktivitet</p>
  </div>

  <div class="menuGrid">

    <button class="menuButton" onclick="showScreen('afleveringer')">
      <div class="menuButtonIcon">🏐</div>
      <div class="menuButtonTitle">Afleveringer</div>
      <div class="menuButtonText">Tæl point for holdene</div>
    </button>

    <button class="menuButton" onclick="showScreen('tid')">
      <div class="menuButtonIcon">⏱️</div>
      <div class="menuButtonTitle">På tid</div>
      <div class="menuButtonText">Mål aktiv tid for hvert hold</div>
    </button>

    <button class="menuButton" onclick="showScreen('trekant')">
      <div class="menuButtonIcon">🔺</div>
      <div class="menuButtonTitle">Trekant</div>
      <div class="menuButtonText">Bonus ved tre tryk i træk</div>
    </button>

    <button class="menuButton" onclick="showScreen('stafet')">
      <div class="menuButtonIcon">🏃</div>
      <div class="menuButtonTitle">Stafet</div>
      <div class="menuButtonText">Start og stop tider for holdene</div>
    </button>

  </div>

</div>


<!-- AFLEVERINGER -->
<div id="afleveringer" class="screen hidden">

<h1>Afleveringer</h1>

<h2>Orange</h2>
<button class="orange" onclick="addPoint('orange',1)">+1</button>
<button class="orange" onclick="addPoint('orange',2)">+2</button>

<h2>Gul</h2>
<button class="yellow" onclick="addPoint('yellow',1)">+1</button>
<button class="yellow" onclick="addPoint('yellow',2)">+2</button>

<h2>Blå</h2>
<button class="blue" onclick="addPoint('blue',1)">+1</button>
<button class="blue" onclick="addPoint('blue',2)">+2</button>

<h3>Orange: <span id="orangeScore">0</span></h3>
<h3>Gul: <span id="yellowScore">0</span></h3>
<h3>Blå: <span id="blueScore">0</span></h3>

<h2>Førende hold: <span id="leader">Ingen</span></h2>

<button onclick="showScreen('menu')">Tilbage</button>

</div>


<!-- PÅ TID -->
<div id="tid" class="screen hidden">

<h1>På tid</h1>

<button class="orange" onclick="activateColor('orange')">Orange</button>
<button class="yellow" onclick="activateColor('yellow')">Gul</button>
<button class="blue" onclick="activateColor('blue')">Blå</button>

<h3>Orange tid: <span id="orangeTime">00</span></h3>
<h3>Gul tid: <span id="yellowTime">00</span></h3>
<h3>Blå tid: <span id="blueTime">00</span></h3>

<button onclick="pauseResume()" id="pauseBtn">Pause</button>
<button onclick="stopGame()">Stop</button>

<h2 id="winner"></h2>

<button onclick="showScreen('menu')">Tilbage</button>

</div>


<!-- TREKANT -->
<div id="trekant" class="screen hidden">

<h1>Trekant</h1>

<button class="orange" onclick="trekantClick('orange')">Orange</button>
<button class="yellow" onclick="trekantClick('yellow')">Gul</button>
<button class="blue" onclick="trekantClick('blue')">Blå</button>

<h3>Orange: <span id="tOrange">0</span></h3>
<h3>Gul: <span id="tYellow">0</span></h3>
<h3>Blå: <span id="tBlue">0</span></h3>

<h2>Førende: <span id="tLeader">Ingen</span></h2>

<button onclick="showScreen('menu')">Tilbage</button>

</div>


<div id="stafet" class="screen hidden">

  <h1>Stafet</h1>

  <button class="controlButton" onclick="startStafet()">Start</button>

  <div class="actionGroup">
    <button id="yellowBtn" class="yellow bigColorButton" onclick="stopYellow()">
      Gul: <span id="yellowStafet">00:00</span>
    </button>

    <button id="greenBtn" class="green bigColorButton" onclick="stopGreen()">
      Grøn: <span id="greenStafet">00:00</span>
    </button>
  </div>

  <button class="controlButton" onclick="resetStafet()">Reset</button>
  <button class="backButton" onclick="showScreen('menu')">Tilbage</button>

</div>


<script src="script.js"></script>

</body>
</html>
