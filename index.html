<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Idræts App</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- FORSIDE -->
  <div id="menu" class="screen">
    <div class="menuHeader">
      <h1>Idræts App</h1>
      <p>Vælg aktivitet</p>
    </div>

    <div class="iconGrid">
      <button class="iconButton menuIconButton" onclick="showScreen('afleveringer')">
        <img src="afleveringer.png" alt="Afleveringer" class="iconImage">
      </button>

      <button class="iconButton menuIconButton" onclick="showScreen('tid')">
        <img src="paatid.png" alt="På tid" class="iconImage">
      </button>

      <button class="iconButton menuIconButton" onclick="showScreen('trekant')">
        <img src="trekant.png" alt="Trekant" class="iconImage">
      </button>

      <button class="iconButton menuIconButton" onclick="showScreen('stafet')">
        <img src="stafet.png" alt="Stafet" class="iconImage">
      </button>
    </div>
  </div>

  <!-- AFLEVERINGER -->
  <div id="afleveringer" class="screen hidden activityScreen">
    <h1>Afleveringer</h1>

    <div class="activityContent">
      <div class="actionGrid">
        <button class="iconButton scoreIconButton" onclick="addPoint('orange', 1)">
          <img src="Orange.png" alt="Orange" class="iconImage">
          <span class="scoreOverlay" id="orangeScore">0</span>
          <span class="winnerOverlay hidden" id="orangeWinner">VINDER</span>
        </button>

        <button class="iconButton scoreIconButton" onclick="addPoint('yellow', 1)">
          <img src="gul.png" alt="Gul" class="iconImage">
          <span class="scoreOverlay" id="yellowScore">0</span>
          <span class="winnerOverlay hidden" id="yellowWinner">VINDER</span>
        </button>

        <button class="iconButton scoreIconButton" onclick="addPoint('blue', 1)">
          <img src="blaa.png" alt="Blå" class="iconImage">
          <span class="scoreOverlay" id="blueScore">0</span>
          <span class="winnerOverlay hidden" id="blueWinner">VINDER</span>
        </button>

        <button class="iconButton" onclick="addPoint('orange', 2)">
          <img src="plusto.png" alt="+2 Orange" class="iconImage">
        </button>

        <button class="iconButton" onclick="addPoint('yellow', 2)">
          <img src="plusto.png" alt="+2 Gul" class="iconImage">
        </button>

        <button class="iconButton" onclick="addPoint('blue', 2)">
          <img src="plusto.png" alt="+2 Blå" class="iconImage">
        </button>
      </div>
    </div>

    <div class="bottomButtonRow">
      <button class="iconButton smallBottomIcon" onclick="showScreen('menu')">
        <img src="tilbage.png" alt="Tilbage" class="iconImage">
      </button>

      <button class="iconButton smallBottomIcon" onclick="finishAfleveringerGame()">
        <img src="stop.png" alt="Afslut spil" class="iconImage">
      </button>

      <button class="iconButton smallBottomIcon" onclick="resetAfleveringerScore()">
        <img src="reset.png" alt="Reset score" class="iconImage">
      </button>
    </div>
  </div>

  <!-- PÅ TID -->
  <div id="tid" class="screen hidden activityScreen">
    <h1>På tid</h1>

    <div class="activityContent">
      <div class="actionGrid">
        <button class="iconButton scoreIconButton" onclick="activateColor('orange')">
          <img src="Orange.png" alt="Orange" class="iconImage">
          <span class="scoreOverlay" id="orangeTime">00</span>
          <span class="winnerOverlay hidden" id="orangeWinner">VINDER</span>
        </button>
         <button class="iconButton scoreIconButton" onclick="activateColor('blue')">
          <img src="blaa.png" alt="Blå" class="iconImage">
          <span class="scoreOverlay" id="yellowTime">00</span>
          <span class="winnerOverlay hidden" id="blueWinner">VINDER</span>
        </button>
        <button class="iconButton scoreIconButton" onclick="activateColor('yellow')">
          <img src="gul.png" alt="Gul" class="iconImage">
          <span class="scoreOverlay" id="yellowTime">00</span>
          <span class="winnerOverlay hidden" id="yellowWinner">VINDER</span>
        </button>

        <button class="bigActionButton neutralAction" onclick="startTimeGame()">Start</button>
        <button class="bigActionButton neutralAction" onclick="pauseResumeTime()" id="timePauseButton">Pause</button>
        <button class="bigActionButton neutralAction" onclick="finishTimeGame()">Stop</button>
      </div>

      <div class="infoPanel">
        <div class="infoLine"><span>Orange</span><strong id="orangeTime">00</strong></div>
        <div class="infoLine"><span>Gul</span><strong id="yellowTime">00</strong></div>
        <div class="infoLine"><span>Blå</span><strong id="blueTime">00</strong></div>
        <div class="infoLine resultLine"><span>Resultat</span><strong id="winner">Ingen endnu</strong></div>
      </div>
    </div>

    <div class="bottomButtonRow">
      <button class="iconButton smallBottomIcon" onclick="showScreen('menu')">
        <img src="tilbage.png" alt="Tilbage" class="iconImage">
      </button>

      <button class="iconButton smallBottomIcon" onclick="pauseResumeTime()">
        <img id="timeToggleIcon" src="pause.png" alt="Pause eller genoptag" class="iconImage">
      </button>

      <button class="iconButton smallBottomIcon" onclick="resetTimeGame()">
        <img src="reset.png" alt="Reset tid" class="iconImage">
      </button>
    </div>
  </div>

  <!-- TREKANT -->
  <div id="trekant" class="screen hidden activityScreen">
    <h1>Trekant</h1>

    <div class="activityContent">
      <div class="actionGrid">
        <button class="bigActionButton orangeAction" onclick="trekantClick('orange')">Orange</button>
        <button class="bigActionButton yellowAction" onclick="trekantClick('yellow')">Gul</button>
        <button class="bigActionButton blueAction" onclick="trekantClick('blue')">Blå</button>

        <div class="bigActionButton statAction">
          Orange: <span id="tOrange">0</span>
        </div>

        <div class="bigActionButton statAction">
          Gul: <span id="tYellow">0</span>
        </div>

        <div class="bigActionButton statAction">
          Blå: <span id="tBlue">0</span>
        </div>
      </div>

      <div class="statusText" id="tLeader">Ingen vinder endnu</div>
    </div>

    <div class="bottomButtonRow">
      <button class="iconButton smallBottomIcon" onclick="showScreen('menu')">
        <img src="tilbage.png" alt="Tilbage" class="iconImage">
      </button>

      <button class="iconButton smallBottomIcon" onclick="finishTrekantGame()">
        <img src="stop.png" alt="Afslut trekant" class="iconImage">
      </button>

      <button class="iconButton smallBottomIcon" onclick="resetTrekantGame()">
        <img src="reset.png" alt="Reset trekant" class="iconImage">
      </button>
    </div>
  </div>

  <!-- STAFET -->
  <div id="stafet" class="screen hidden activityScreen">
    <h1>Stafet</h1>

    <div class="activityContent">
      <div class="actionGrid">
        <button class="bigActionButton neutralAction" onclick="startStafet()">Start</button>
        <button class="bigActionButton yellowAction" onclick="stopYellow()">Stop gul</button>
        <button class="bigActionButton greenAction" onclick="stopGreen()">Stop grøn</button>

        <div class="bigActionButton statAction">
          Gul: <span id="yellowStafet">00:00</span>
        </div>

        <div class="bigActionButton statAction">
          Grøn: <span id="greenStafet">00:00</span>
        </div>

        <div class="bigActionButton statAction">
          <span id="stafetStatus">Klar</span>
        </div>
      </div>

      <div class="statusText" id="stafetWinner">Ingen vinder endnu</div>
    </div>

    <div class="bottomButtonRow">
      <button class="iconButton smallBottomIcon" onclick="showScreen('menu')">
        <img src="tilbage.png" alt="Tilbage" class="iconImage">
      </button>

      <button class="iconButton smallBottomIcon" onclick="finishStafetGame()">
        <img src="stop.png" alt="Afslut stafet" class="iconImage">
      </button>

      <button class="iconButton smallBottomIcon" onclick="resetStafet()">
        <img src="reset.png" alt="Reset stafet" class="iconImage">
      </button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
